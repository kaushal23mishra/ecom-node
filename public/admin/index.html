<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Premium Admin | Node DHI</title>
  <link rel="stylesheet" href="css/main.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Animated Background Elements -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div id="app">
    <!-- Login View -->
    <div id="login-view" class="auth-wrapper" style="display: none;">
      <div class="auth-card animate-slide-up">
        <div class="logo-container" style="justify-content: center; transform: scale(1.3); margin-bottom: 3rem;">
          <div class="logo-box">
            <i data-lucide="layers" style="color: white;"></i>
          </div>
          <span class="logo-text">Node DHI</span>
        </div>
        <div style="text-align: center; margin-bottom: 2.5rem;">
          <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif;">Welcome back</h1>
          <p style="color: var(--text-secondary); font-size: 0.95rem;">Enter your credentials to access the portal</p>
        </div>
        <form id="login-form">
          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Username</label>
            <input type="text" id="username" class="search-input" style="background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 16px; margin-left: 0;" placeholder="admin" required>
          </div>
          <div style="margin-bottom: 2.5rem;">
            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem;">Password</label>
            <input type="password" id="password" class="search-input" style="background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 1rem; border-radius: 16px; margin-left: 0;" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn-action" style="width: 100%; padding: 1.1rem; font-size: 1rem; letter-spacing: 0.5px;">Sign In to Dashboard</button>
        </form>
      </div>
    </div>

    <!-- Admin Shell -->
    <div id="admin-shell" class="app-container" style="display: none;">
      <aside class="sidebar">
        <div class="logo-container">
          <div class="logo-box">
            <i data-lucide="layers" style="color: white;"></i>
          </div>
          <span class="logo-text">Node DHI</span>
        </div>

        <div class="nav-group">
          <div class="nav-label">Core Management</div>
          <nav>
            <a href="#" class="nav-item active" data-view="dashboard">
              <i data-lucide="layout-dashboard"></i> Dashboard
            </a>
            <a href="#" class="nav-item" data-view="users">
              <i data-lucide="users"></i> User Directory
            </a>
            <a href="#" class="nav-item" data-view="products">
              <i data-lucide="package"></i> Inventory
            </a>
            <a href="#" class="nav-item" data-view="orders">
              <i data-lucide="shopping-bag"></i> Orders
            </a>
          </nav>
        </div>

        <div class="nav-group" style="margin-top: auto;">
          <div class="nav-label">Settings & Config</div>
          <nav>
            <a href="#" class="nav-item" data-view="settings">
              <i data-lucide="settings"></i> System Settings
            </a>
            <a href="#" class="nav-item" id="logout-btn" style="color: var(--error);">
              <i data-lucide="log-out"></i> End Session
            </a>
          </nav>
        </div>
      </aside>

      <div class="top-bar">
        <div class="search-container">
          <i data-lucide="search" style="width: 20px; color: var(--text-muted);"></i>
          <input type="text" class="search-input" placeholder="Search analytics, logs, users...">
        </div>
        <div style="display: flex; align-items: center; gap: 2.5rem;">
          <div style="position: relative; cursor: pointer;">
            <i data-lucide="bell" style="width: 24px; color: var(--text-secondary);"></i>
            <div style="position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: var(--secondary); border-radius: 50%; border: 2px solid var(--bg-app); box-shadow: 0 0 10px var(--secondary);"></div>
          </div>
          <div class="user-profile">
            <div style="text-align: right;">
              <div id="user-display" style="font-weight: 800; font-size: 0.95rem; font-family: 'Outfit', sans-serif;">---</div>
              <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Super Admin</div>
            </div>
            <div class="avatar">
              <img id="user-avatar" src="" alt="Avatar">
            </div>
          </div>
        </div>
      </div>

      <main class="main-wrapper">
        <div id="view-container" class="animate-fade-in">
          <!-- Views injected here -->
        </div>
      </main>
    </div>

    <!-- Generic Modal -->
    <div id="modal-wrapper" class="modal-overlay" style="display: none;">
      <div class="modal-card animate-slide-up">
        <div class="modal-header">
          <h2 id="modal-title" style="font-family: 'Outfit', sans-serif;">Action</h2>
          <button id="close-modal" class="btn-icon"><i data-lucide="x"></i></button>
        </div>
        <div id="modal-body" class="modal-content">
          <!-- Form injected here -->
        </div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
